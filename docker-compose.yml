services:
  app:
    build:
      context: .
      target: production
    container_name: lab10-fastify-app
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      ADMIN_API_KEY: lab-admin-key
      CORS_ORIGIN: http://127.0.0.1:3000
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DB: lab_10_inventory
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: lab-jwt-secret-key-at-least-32-chars
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3000:3000'
    volumes:
      - uploads-data:/app/uploads
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: lab10-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lab_10_inventory
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - '3307:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lab10-redis
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  uploads-data:
